{
  "name": "Release explicit B",
  "on": {
    "release": {
      "types": [
        "edited",
        "unpublished",
        "released"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "edited": {
      "name": "Explicit B edited",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "probe",
          "name": "Validate release payload and checkout",
          "run": "python fixtures/release/release_probe.py",
          "env": {
            "ALLOWED_ACTIONS": "edited,unpublished,released",
            "EXPECTED_TAG": "${{ github.event.release.tag_name }}",
            "WORKFLOW_MARKER": "explicit-b-edited",
            "EXPECTED_ACTION": "edited"
          }
        }
      ],
      "if": "${{ github.event.action == 'edited' }}"
    },
    "unpublished": {
      "name": "Explicit B unpublished",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "probe",
          "name": "Validate release payload and checkout",
          "run": "python fixtures/release/release_probe.py",
          "env": {
            "ALLOWED_ACTIONS": "edited,unpublished,released",
            "EXPECTED_TAG": "${{ github.event.release.tag_name }}",
            "WORKFLOW_MARKER": "explicit-b-unpublished",
            "EXPECTED_ACTION": "unpublished"
          }
        }
      ],
      "if": "${{ github.event.action == 'unpublished' }}"
    },
    "released": {
      "name": "Explicit B released",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "probe",
          "name": "Validate release payload and checkout",
          "run": "python fixtures/release/release_probe.py",
          "env": {
            "ALLOWED_ACTIONS": "edited,unpublished,released",
            "EXPECTED_TAG": "${{ github.event.release.tag_name }}",
            "WORKFLOW_MARKER": "explicit-b-released",
            "EXPECTED_ACTION": "released"
          }
        }
      ],
      "if": "${{ github.event.action == 'released' }}"
    }
  }
}
