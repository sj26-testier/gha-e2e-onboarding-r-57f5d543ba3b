{
  "name": "Release bare",
  "on": "release",
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "name": "Bare release",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "probe",
          "name": "Validate release payload and checkout",
          "run": "python fixtures/release/release_probe.py",
          "env": {
            "ALLOWED_ACTIONS": "created,edited,published,unpublished,prereleased,released,deleted",
            "EXPECTED_TAG": "${{ github.event.release.tag_name }}",
            "WORKFLOW_MARKER": "bare"
          }
        }
      ]
    }
  }
}
